# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = backend/migrations

# template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# sys.path configuration
prepend_sys_path = .

version_path_separator = os

# default connection (overridden dynamically by env.py from DATABASE_URL)
sqlalchemy.url = sqlite:///./backend/artifacts/predictions.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
